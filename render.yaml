# Publicação no Render (https://render.com) — cria tudo de uma vez:
#   API (com tempo real), app e painel. O banco é o PostgreSQL do Supabase.
# No Render: New → Blueprint → escolha este repositório → Apply.
#
# Modo real: os dados de demonstração são removidos a cada inicialização.
# ADMIN_EMAILS define o administrador geral (vira admin ao entrar com a própria senha).
# Plano gratuito: a API "dorme" após 15 min sem uso (o primeiro acesso demora ~1 min)
# Para o lançamento, troque a API por um plano pago (sem pausa).

services:
  - type: web
    name: vrum-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run start:producao -w @vrum/api
    healthCheckPath: /saude
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL          # banco no Supabase: "Session pooler" (veja SERVICOS.md)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_EMAILS          # administrador(es) geral(is), separados por vírgula
        value: zilglezio@gmail.com
      # ── Integrações (veja SERVICOS.md). Pode deixar em branco: cada uma liga quando a chave existir. ──
      - key: SUPABASE_URL          # arquivos: https://xxxx.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vrum
      - key: ORS_API_KEY           # rotas e previsão de chegada (OpenRouteService)
        sync: false

  - type: web
    name: vrum-app
    runtime: static
    buildCommand: npm ci && npm run build -w @vrum/app
    staticPublishPath: apps/app/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # O service worker das notificações precisa ser sempre a versão mais recente.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL           # endereço público da API (troque se o Render der outro nome)
        value: https://vrum-api.onrender.com
      - key: VITE_MAPA_ESTILO       # mapa OpenFreeMap (sem chave): vrum-escuro, liberty, bright, positron ou URL
        value: vrum-escuro

  - type: web
    name: vrum-painel
    runtime: static
    buildCommand: npm ci && npm run build -w @vrum/painel
    staticPublishPath: apps/painel/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL           # endereço público da API (troque se o Render der outro nome)
        value: https://vrum-api.onrender.com
